['Alt+Tab karke Video window par jao aur use MAXIMIZE karo',W3,s=>s.w.some(x=>x.n=='Video'&&x.p=='M'),'Alt+Tab × 2 → Win+Up'],
['Sab windows hata ke DESKTOP dikhao',W3,s=>s.w.every(x=>x.p=='m'),'Win+D   (dobara dabane par sab wapas)'],
['Video hang ho gaya — Task Manager se End Task karo',()=>WN([{n:'Email'},{n:'Report'},{n:'Video',hung:1}]),s=>!s.w.some(x=>x.n=='Video'),'Ctrl+Shift+Esc → Down × 2 → Delete   |   Alternate: Alt+E']]}
];
const LB={PageUp:'PgUp',PageDown:'PgDn',Backspace:'⌫',Insert:'Ins',Delete:'Del',CapsLock:'Caps',Up:'▲',Down:'▼',Left:'◀',Right:'▶'};
const nm=e=>{const c=e.code||'';if(/^Control/.test(c))return'Ctrl';if(/^Alt/.test(c))return'Alt';if(/^Shift/.test(c))return'Shift';if(/^(Meta|OS)/.test(c))return'Win';return c.replace(/^(Key|Digit)/,'').replace('Arrow','').replace('Escape','Esc').replace('Semicolon',';').replace('Slash','/')};
const cb=(k,e)=>MO.filter(m=>m!=k&&(mods.has(m)||e&&({Ctrl:e.ctrlKey,Alt:e.altKey,Shift:e.shiftKey,Win:e.metaKey})[m])).concat(k).join('+');
function home(){G={m:'home'};
app.innerHTML=`<div class=card>⚡ XP: <b>${D.xp||0}</b><br><small>Ab asli practice hai: screen par real text, files, tabs aur windows milenge. Jo kaam bola hai wo karo — koi bhi sahi tarika (alternate shortcut bhi) chalega. Ctrl/Alt/Shift/Win pehle tap karo (hara ho jaata hai), phir key. Mouse ki jagah seedha screen ke items tap karo.</small></div><button class=lv style=background:#6c8cff onclick=mix()>🎲 Mix Practice (alag-alag cheezein, baar baar)</button>`+
SK.map((v,i)=>{const ok=i==0||D.st[i-1];return `<button class=lv ${ok?'':'disabled'} onclick=intro(${i})>${ok?v.i:'🔒'} Lesson ${i+1}: ${v.n} ${'⭐'.repeat(D.st[i]||0)}</button>`}).join('')+
(Object.keys(D.st).length?`<div class=card><b>📚 Notes Library</b>`+SK.map((v,i)=>D.st[i]?`<details><summary>${v.n}</summary><pre>${v.nt}</pre></details>`:'').join('')+`</div>`:'')}
function intro(i){G={m:'intro'};const v=SK[i];app.innerHTML=`<div class=card><h2>${v.i} ${v.n}</h2><p>${v.T.length} tasks · asli screen par practice</p><b>📖 Pehle notes:</b><pre>${v.nt}</pre></div><button onclick=lsn(${i})>▶ Start</button><button onclick=home() style=background:#444>← Back</button>`}
function lsn(i){run(SK[i].T.map((_,j)=>[i,j]),SK[i].n,i)}
function mix(){const pool=[],ok=a=>D.st[a]||(!Object.keys(D.st).length&&a==0);SK.forEach((v,a)=>{if(ok(a))v.T.forEach((_,b)=>{const w=1+(D.wk[a+'.'+b]||0)*2;for(let j=0;j<w;j++)pool.push([a,b])})});
const u=new Set(pool.map(String)).size,pick=[];while(pick.length<8&&pick.length<u){const x=pool[Math.random()*pool.length|0];if(!pick.some(y=>String(y)==String(x)))pick.push(x)}
run(pick,'🎲 Mix Practice',-1)}
function run(q,t,sk){G={m:'play',q,i:0,xp:0,h:0,t,sk,rq:{}};next()}
function next(){const[a,b]=G.q[G.i];G.cur=SK[a].T[b];G.s=G.cur[1]();hint=0;lock=0;mods.clear();draw()}
function draw(){const n=G.q.length;app.innerHTML=`<div class=card><div class=bar><i style=width:${G.i/n*100}%></i></div><small>${G.t} · ${G.i+1}/${n} · ⚡ ${G.xp} XP</small><h3 style=margin:8px>${G.cur[0]}</h3><div id=sc class=sc></div><div id=hn class=how style=display:none></div><button onclick=hint1()>💡 Hint</button><button onclick=rst() style=background:#444>↺ Reset</button><br><small>Ctrl/Alt/Shift/Win pehle tap karo (hara hoga), phir key. Koi bhi sahi tarika chalega!</small></div><div id=kb></div>`;view();kbd();if(hint)hn()}
function view(){if(G.m!='play')return;const e=$('#sc');if(e)e.innerHTML=SC[G.s.k].view(G.s)}
function hn(){const e=$('#hn');if(e){e.style.display=hint?'block':'none';e.textContent='💡 '+G.cur[3]}}
function hint1(){hint=1;hn()}
function rst(){if(G.m!='play'||lock)return;G.s=G.cur[1]();view()}
function key(c){if(G.m!='play'||lock)return;const s=G.s;SC[s.k].key(s,c);view();if(G.cur[2](s))win()}
function win(){lock=1;$('#sc').classList.add('ok');const[a,b]=G.q[G.i],id=a+'.'+b;G.xp+=hint?5:10;
if(hint){G.h++;D.wk[id]=(D.wk[id]||0)+1;if(!G.rq[id]){G.rq[id]=1;G.q.push(G.q[G.i])}}else D.wk[id]=Math.max(0,(D.wk[id]||0)-1);
setTimeout(()=>{G.i++;G.i>=G.q.length?fin():next()},900)}
function fin(){const l=G.sk>=0,s=G.h==0?3:G.h<=2?2:1;D.xp=(D.xp||0)+G.xp;if(l)D.st[G.sk]=Math.max(D.st[G.sk]||0,s);sv();G.m='done';
app.innerHTML=`<div class=card><h2>🎉 Session Complete!</h2><p>⚡ ${G.xp} XP · ${l?'⭐'.repeat(s)+' · ':''}Hints: ${G.h}</p>${l?`<b>📚 Notes (Notes Library mein save ho gaye):</b><pre>${SK[G.sk].nt}</pre>`:'<small>Jin tasks mein hint liya, wo agli Mix Practice mein zyada aayenge.</small>'}</div>`+(l&&G.sk+1<SK.length?`<button onclick=intro(${G.sk+1})>Next Lesson ▶</button>`:'')+`<button onclick=mix()>🎲 Mix Practice</button><button onclick=home()>🏠 Home</button>`}
function kbd(){const e=$('#kb');if(!e)return;
const KP={a:['1234567890'.split(''),'QWERTYUIOP'.split(''),'ASDFGHJKL;'.split(''),'ZXCVBNM/'.split('')],f:[['Esc','F1','F2','F3'],['F4','F5','F6','F7'],['F8','F9','F10','F11'],['F12','Insert']],n:[['Up'],['Left','Down','Right'],['Home','End','PageUp','PageDown'],['Backspace','Delete','Tab','Enter'],['Space','CapsLock']]};
e.innerHTML=`<div class=r>${MO.map(m=>`<div class='k m ${mods.has(m)||down.has(m)?'on':''}' data-m=${m}>${m}</div>`).join('')}</div>`+KP[kt].map(r=>`<div class=r>${r.map(k=>`<div class=k data-k=${k}>${LB[k]||k}</div>`).join('')}</div>`).join('')+`<div class=r>${[['a','Aa 1-0'],['f','Fn Keys'],['n','Nav Keys']].map(t=>`<div class='k t ${kt==t[0]?'on':''}' data-t=${t[0]}>${t[1]}</div>`).join('')}</div>`}
document.addEventListener('click',e=>{const d=e.target.closest('[data-k],[data-m],[data-t],[data-p]');if(!d||G.m!='play')return;const a=d.dataset;
if(a.k!=null){key(cb(a.k));mods.clear();kbd()}
else if(a.m){mods.has(a.m)?mods.delete(a.m):mods.add(a.m);kbd()}
else if(a.t){kt=a.t;kbd()}
else if(a.p!=null&&!lock){const s=G.s,S=SC[s.k];if(S.tap){S.tap(s,+a.p,mods);mods.clear();view();kbd();if(G.cur[2](s))win()}}});
addEventListener('keydown',e=>{if(G.m!='play')return;e.preventDefault();if(e.repeat)return;const k=nm(e);down.add(k);if(MO.includes(k)){kbd();return}key(cb(k,e));mods.clear();kbd()});
addEventListener('keyup',e=>{down.delete(nm(e));kbd()});
addEventListener('blur',()=>{down.clear();kbd()});
home();
</script></body></html>
