<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Key Master</title>
<style>
:root{--bg:#0f1220;--card:#1b2036;--ac:#6c8cff;--ok:#3ddc97;--bad:#ff5c72;--tx:#e8ebff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:720px;margin:0 auto}
h1{text-align:center;margin:8px 0}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:16px;cursor:pointer;margin:4px;touch-action:manipulation}
button[disabled]{opacity:.4;cursor:not-allowed}
.lv{display:block;width:100%;text-align:left;background:#252b4a;margin:6px 0}
kbd{display:inline-block;background:#0b0e1a;border:1px solid #3a4270;border-bottom-width:3px;border-radius:6px;padding:4px 10px;margin:2px;font:16px monospace;color:var(--tx)}
kbd.on{background:var(--ok);color:#04150d}
.mock{border:2px dashed #3a4270;border-radius:12px;padding:16px;text-align:center;min-height:110px}
.mock.ok{border-color:var(--ok);background:#12301f}
.mock.bad{border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.how{font-size:14px;line-height:1.5;color:#c4ccff;background:#0b0e1a;border-radius:8px;padding:8px;margin:8px 0;text-align:left}
.bar{height:8px;background:#0b0e1a;border-radius:8px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--ok)}
pre{white-space:pre-wrap;font:inherit;line-height:1.7;margin:8px 0 0}
details{margin:6px 0}
#kb{background:var(--card);border-radius:14px;padding:6px;margin:10px 0}
.r{display:flex;gap:4px;margin:4px 0}
.k{flex:1;min-width:0;height:42px;display:flex;align-items:center;justify-content:center;background:#252b4a;border-radius:8px;font-size:13px;cursor:pointer;border-bottom:3px solid #0b0e1a;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.k.m{background:#3a4270;font-weight:700}
.k.on{background:var(--ok);color:#04150d}
.k.t{height:32px;background:#161a2e}
.ms{display:flex;gap:6px;justify-content:center}
.ms .k{height:54px;flex:none;width:96px;font-size:14px}
</style></head><body><main><h1>⌨️ Key Master</h1><div id="app"></div></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const L=[
{n:'Clipboard Basics',p:'📝 Notepad',t:[['Selected text ko COPY karo','Ctrl+C','Pehle text select karo (Ctrl+A se sab, ya Shift+Arrow se thoda).'],['Copy kiya hua PASTE karo','Ctrl+V','Pehle kuch copy/cut hona chahiye. Cursor wahan rakho jahan paste karna hai.'],['Text CUT karo','Ctrl+X','Select karke cut karo: text hat ke clipboard mein jaata hai.'],['Galti hui - UNDO karo','Ctrl+Z','Har baar dabane par ek step peeche jaata hai.'],['Undo wapas - REDO karo','Ctrl+Y','Sirf Undo ke baad kaam karta hai (Ctrl+Shift+Z bhi chalta hai).'],['Poora text SELECT ALL karo','Ctrl+A']]},
{n:'Cursor & Selection',p:'📄 Word Processor',t:[['Line ke START par jao','Home'],['Line ke END par jao','End'],['Ek word aage jao','Ctrl+Right'],['Ek word peeche jao','Ctrl+Left'],['Document ke shuru mein jao','Ctrl+Home'],['Document ke end mein jao','Ctrl+End'],['Cursor se line-end tak select karo','Shift+End','Shift + koi bhi move key = select.'],['Ek word aage tak select karo','Ctrl+Shift+Right'],['Ek screen neeche jao','PageDown']]},
{n:'Formatting & Save',p:'📃 MS Word',t:[['Text BOLD karo','Ctrl+B','Pehle text select karo.'],['Text ITALIC karo','Ctrl+I'],['Text UNDERLINE karo','Ctrl+U'],['Text CENTER align karo','Ctrl+E'],['Document SAVE karo','Ctrl+S'],['Document PRINT karo','Ctrl+P']]},
{n:'File Explorer',p:'📁 File Explorer',t:[['File ka naam BADLO (rename)','F2','Pehle file select karo.'],['File ko Recycle Bin mein bhejo','Delete','Pehle file select karo.'],['File PERMANENTLY delete karo','Shift+Delete','Bin mein nahi jaati, wapas nahi aayegi!'],['File ki PROPERTIES kholo','Alt+Enter'],['Folder REFRESH karo','F5'],['Parent folder mein jao','Alt+Up'],['Pichle folder par wapas jao','Alt+Left']]},
{n:'Web Browser',p:'🌐 Browser',t:[['Page par kuch DHUNDHO','Ctrl+F'],['Page REFRESH karo','F5'],['HISTORY kholo','Ctrl+H'],['Page ko BOOKMARK karo','Ctrl+D'],['Pichle page par jao','Alt+Left'],['FULLSCREEN karo','F11']]},
{n:'Spreadsheet',p:'📊 Excel',t:[['Cell EDIT mode mein jao','F2','Pehle cell select karo.'],['Reference ko $ se LOCK karo','F4','Formula edit mode mein reference par cursor rakho.'],['Poora COLUMN select karo','Ctrl+Space'],['Poori ROW select karo','Shift+Space'],['Data ke neeche tak jump karo','Ctrl+Down'],['Seedha A1 par jao','Ctrl+Home'],['Aaj ki DATE daalo','Ctrl+;']]},
{n:'Function Row & System',p:'🖥️ Windows',t:[['HELP kholo','F1'],['SEARCH / Find next','F3'],['Address bar / pane badlo','F6'],['SPELL CHECK chalao','F7'],['MENU BAR activate karo','F10'],['SCREENSHOT lo','PrintScreen','Poori screen clipboard mein copy hoti hai.'],['START MENU kholo (Windows key)','Win']]},
{n:'Power User / Coding',p:'💻 Code Editor',t:[['Line INDENT karo','Tab'],['Indent WAPAS karo','Shift+Tab'],['Line COMMENT karo','Ctrl+/'],['Line ko UPAR move karo','Alt+Up'],['REDO (doosra tarika)','Ctrl+Shift+Z'],['Overwrite mode ON/OFF','Insert'],['Pichla character delete karo','Backspace'],['Popup BAND karo','Esc']]},
{n:'Mouse + Keyboard',p:'🖱️ Mouse Practice',m:1,t:[['File SELECT karo (single click)','Click'],['Folder KHOLO (double click)','DblClick','L-Click par jaldi se 2 baar tap karo.'],['Menu kholo (right click)','RClick'],['Alag-alag files SELECT karo','Ctrl+Click','Pehle Ctrl tap karo, phir L-Click.'],['Pehli se yahan tak RANGE select karo','Shift+Click','Pehli file click karo, phir Shift tap karke aakhri par click.'],['Page neeche scroll karo','ScrollDown'],['Page upar scroll karo','ScrollUp'],['ZOOM IN karo','Ctrl+ScrollUp'],['ZOOM OUT karo','Ctrl+ScrollDown']]},
{n:'Bina Mouse Ke',p:'⌨️ Keyboard Only',t:[['Agle button par jao','Tab'],['Pichle button par jao','Shift+Tab'],['Selected button CLICK karo','Enter'],['Checkbox TICK karo','Space'],['Right-click MENU kholo (keyboard se)','Shift+F10','Mouse ke bina right-click ka kaam.'],['Menu mein NEECHE jao','Down'],['Menu mein UPAR jao','Up'],['Menu BAND karo','Esc'],['Menu bar par jao','F10']]},
{n:'Screenshot → Document',p:'📸 Screenshot Workflow',v:1,sc:'Screen ka ek hissa capture karke naye document mein daalna aur save karna hai.',t:[['Screen ka hissa CAPTURE karo (Snip)','Win+Shift+S','Pehle wo screen kholo jiska screenshot chahiye. Phir ye combo dabao aur area chuno (poori screen ke liye sirf PrtSc).'],['Naya document kholo','Ctrl+N','Word ya Notepad khula hona chahiye. Doosri app mein ho to pehle Alt+Tab se wahan jao.'],['Screenshot PASTE karo','Ctrl+V','Snip khud clipboard mein hota hai, copy ki zarurat nahi. Cursor document mein hona chahiye.'],['Document SAVE karo','Ctrl+S','Pehli baar save par naam poochta hai: naam likho aur Enter dabao.'],['Window BAND karo','Alt+F4','Pehle Ctrl+S zaroor karo, warna changes chale jaate hain. Alt+F4 sirf active window band karta hai.']]},
{n:'Clipboard Pro',p:'📋 Report Writing',v:1,sc:'Do lines copy karke report mein bina formatting bigde paste karni hain.',t:[['Line SELECT karo','Shift+End','Pehle cursor line ke shuru mein rakho (Home dabao). Shift+End wahan se line ke end tak select karta hai.'],['Selected line COPY karo','Ctrl+C','Copy sirf tab chalta hai jab text select ho.'],['Agli line bhi SELECT karo','Shift+Down','Cursor agli line ke shuru mein lao. Shift+Down se poori line select hoti hai.'],['Ise bhi COPY karo','Ctrl+C','Ab clipboard history mein 2 cheezein hain.'],['CLIPBOARD HISTORY kholo','Win+V','Pehli baar "Turn on" poochta hai. Cursor wahan rakho jahan paste karna hai.'],['Purani item chuno','Down','History list mein Up/Down se item chuno.'],['Chuni hui item PASTE karo','Enter','Enter dabate hi item cursor par paste ho jaati hai.'],['Bina FORMATTING ke paste karo','Ctrl+Shift+V','Website se copy kiya text apna font/colour saath laata hai. Is combo se sirf saaf text aata hai.']]},
{n:'Multitasking & Windows',p:'🪟 Window Manager',v:1,sc:'Email aur report side-by-side kholni hain, phir ek hang ho chuka app band karna hai.',t:[['Doosri app par SWITCH karo','Alt+Tab','Alt dabaye rakho aur Tab baar baar dabao; Alt chhodte hi window khul jaati hai. On-screen: pehle Alt tap, phir Tab.'],['Window ko LEFT half mein snap karo','Win+Left','Pehle wo window active karo (Alt+Tab). Snap ke baad Windows doosri window chunne ko bolta hai.'],['Doosri window ko RIGHT half mein snap karo','Win+Right','Alt+Tab se doosri window active karo, phir ye combo dabao.'],['Window MAXIMIZE karo','Win+Up','Active window par hi chalta hai.'],['Window neeche karo (restore / minimize)','Win+Down','Pehli baar restore karta hai, doosri baar minimize.'],['Sab windows hata ke DESKTOP dekho','Win+D','Dobara dabane par sab windows wapas aa jaati hain.'],['App HANG hai - TASK MANAGER kholo','Ctrl+Shift+Esc','Ctrl+Alt+Del se tez: seedha Task Manager khulta hai.'],['Hung app chuno','Down','List mein Up/Down se us app par jao jo "Not responding" hai.'],['App ko END TASK karo','Delete','Hung app select hone ke baad. (Windows 10 par Alt+E bhi chalta hai.)']]},
{n:'Browser Pro (Tabs & Windows)',p:'🌐 Research Session',v:1,sc:'Research ke liye kai tab kholne, unke beech ghoomna aur galti se band hua tab wapas laana hai.',t:[['Naya TAB kholo','Ctrl+T','Browser window active honi chahiye.'],['Agle tab par jao','Ctrl+Tab','Tabs left se right ghoomte hain; aakhri ke baad pehle par aa jaata hai.'],['Pichle tab par jao','Ctrl+Shift+Tab','Ulti disha mein ghoomta hai.'],['Seedha 2nd tab par jao','Ctrl+2','Ctrl+1 se Ctrl+8 tab number hain; Ctrl+9 = aakhri tab. Digit keys Letters tab mein hain.'],['Current tab BAND karo','Ctrl+W','Band karne se pehle dekh lo ki kuch save to nahi karna.'],['Band hua tab WAPAS lao','Ctrl+Shift+T','Galti se band hua tab wapas khulta hai (pichle kai tab tak).'],['Naya WINDOW kholo','Ctrl+N','Alag window = alag workspace. Win+Left/Right se side-by-side rakh sakte ho.'],['PRIVATE (Incognito) window kholo','Ctrl+Shift+N','Firefox mein Ctrl+Shift+P.']]}
];
let S={m:'home',l:0,i:0,x:0,sc:0},down=new Set(),mods=new Set(),lock=0,hint=0,w=0,lc=0,tb='a';
const MO=['Win','Ctrl','Alt','Shift'];
const DN={Click:'🖱️ Left Click',RClick:'🖱️ Right Click',DblClick:'🖱️ Double Click',ScrollUp:'🖱️ Scroll ▲',ScrollDown:'🖱️ Scroll ▼'};
const LB={PrintScreen:'PrtSc',PageUp:'PgUp',PageDown:'PgDn',Backspace:'⌫',Insert:'Ins',Delete:'Del',CapsLock:'Caps',Up:'▲',Down:'▼',Left:'◀',Right:'▶'};
const ld=()=>{try{return JSON.parse(localStorage.km)||{}}catch(e){return{}}};
const sv=(l,s)=>{try{const d=ld();d[l]=Math.max(d[l]||0,s);localStorage.km=JSON.stringify(d)}catch(e){}};
const nm=e=>{const c=e.code||'';if(/^Control/.test(c))return'Ctrl';if(/^Alt/.test(c))return'Alt';if(/^Shift/.test(c))return'Shift';if(/^(Meta|OS)/.test(c))return'Win';return c.replace(/^(Key|Digit)/,'').replace('Arrow','').replace('Escape','Esc').replace('Semicolon',';').replace('Slash','/')};
const cb=(k,e)=>MO.filter(m=>m!=k&&(mods.has(m)||e&&({Ctrl:e.ctrlKey,Alt:e.altKey,Shift:e.shiftKey,Win:e.metaKey})[m])).concat(k).join('+');
const T=()=>{const a=L[S.l].t[S.i];return{q:a[0],k:a[1],h:a[2]}};
const notes=v=>(v.sc?'🎯 '+v.sc+'\n\n':'')+v.t.map((t,j)=>(j+1)+'. '+t[1]+' → '+t[0]+(t[2]?'\n   🧠 '+t[2]:'')).join('\n');
function home(){S.m='home';const d=ld(),tot=Object.values(d).reduce((a,b)=>a+b,0);
app.innerHTML=`<div class=card>⭐ Total: <b>${tot}</b> / ${L.length*3}<br><small>Level clear karoge to agla khulega. Har step ke saath "kaise" (pre-requisite) milta hai. Notes level se pehle milte hain aur clear karne ke baad Notes Library mein save ho jaate hain. Phone par: Ctrl/Alt/Shift/Win pehle tap karo (ON hoga), phir doosri key.</small></div>`+
L.map((v,i)=>{const ok=i==0||d[i-1];return `<button class=lv ${ok?'':'disabled'} onclick="intro(${i})">${ok?'':'🔒 '}Level ${i+1}: ${v.n} — ${v.p} ${'⭐'.repeat(d[i]||0)}</button>`}).join('')+
(Object.keys(d).length?`<div class=card><b>📚 Notes Library</b>`+L.map((v,i)=>d[i]?`<details><summary>Level ${i+1}: ${v.n}</summary><pre>${notes(v)}</pre></details>`:'').join('')+`</div>`:'')}
function intro(i){S.m='intro';S.l=i;const v=L[i];
app.innerHTML=`<div class=card><h2>Level ${i+1}: ${v.n}</h2><p>Prototype: <b>${v.p}</b> · ${v.t.length} steps${v.m?' · 🖱️ virtual mouse milega':''}${v.v?' · 🔒 On-screen keyboard se karo (system shortcuts browser pakad leta hai)':''}</p><b>📖 Pehle poora tareeka padh lo:</b><pre>${notes(v)}</pre></div><button onclick=start()>▶ Start Practice</button><button onclick=home() style="background:#444">← Back</button>`}
function start(){S.m='play';S.i=0;S.x=0;S.sc=0;hint=0;w=0;mods.clear();draw()}
function draw(){const v=L[S.l],n=v.t.length,t=T();
app.innerHTML=`<div class=card><div class=bar><i style="width:${S.i/n*100}%"></i></div><small>${v.p} · Step ${S.i+1}/${n} · Score ${S.sc} · Galtiyan ${S.x}</small>${v.sc?`<br><small>🎯 ${v.sc}</small>`:''}</div><div class=card><div class=mock id=mk><h3>${t.q}</h3>${t.h?`<div class=how>🧠 ${t.h}</div>`:''}<div id=ks></div><p id=msg><small>Ctrl/Alt/Shift/Win pehle tap karo, phir key</small></p></div><button onclick="hint=1;paint()">💡 Hint</button></div>`+
(v.m?`<div class="card ms"><div class=k onclick="vs('Click',event)">🖱️ L-Click</div><div class=k onclick="vs('RClick',event)">R-Click</div><div style="display:flex;flex-direction:column;gap:4px"><div class=k style="height:25px;width:60px" onclick="vs('ScrollUp',event)">▲</div><div class=k style="height:25px;width:60px" onclick="vs('ScrollDown',event)">▼</div></div></div>`:'')+`<div id=kb></div>`;kbd()}
function kbd(){const e=$('#kb');if(!e)return;
const P={a:['1234567890'.split(''),'QWERTYUIOP'.split(''),'ASDFGHJKL;'.split(''),'ZXCVBNM/'.split('')],f:[['Esc','F1','F2','F3'],['F4','F5','F6','F7'],['F8','F9','F10','F11'],['F12','PrintScreen','Insert','Delete']],n:[['Up'],['Left','Down','Right'],['Home','End','PageUp','PageDown'],['Backspace','Tab','Enter'],['Space','CapsLock']]};
const key=k=>`<div class=k onclick="vk('${k}')">${LB[k]||k}</div>`;
e.innerHTML='<div class=r>'+MO.map(m=>`<div class="k m ${mods.has(m)?'on':''}" onclick="vm('${m}')">${m}</div>`).join('')+'</div>'+P[tb].map(r=>'<div class=r>'+r.map(key).join('')+'</div>').join('')+'<div class=r>'+[['a','Aa 1-0'],['f','Fn Keys'],['n','Nav Keys']].map(t=>`<div class="k t ${tb==t[0]?'on':''}" onclick="tb='${t[0]}';kbd()">${t[1]}</div>`).join('')+'</div>';paint()}
function paint(){const e=$('#ks');if(S.m!='play'||!e)return;const t=T().k;
e.innerHTML=hint?t.split('+').map(k=>`<kbd class="${down.has(k)||mods.has(k)?'on':''}">${DN[k]||k}</kbd>`).join(' + '):'<kbd>?</kbd>'}
function vm(m){if(S.m!='play')return;if(T().k==m){check(m);mods.clear()}else mods.has(m)?mods.delete(m):mods.add(m);kbd()}
function vk(k){if(S.m!='play')return;check(cb(k));mods.clear();kbd()}
function vs(b,e){if(S.m!='play'||lock)return;const t=T().k,n=Date.now();
if(t=='DblClick'&&b=='Click'){if(n-lc<450){lc=0;check('DblClick')}else{lc=n;$('#msg').innerHTML='<small>Jaldi se dobara tap karo (double-click)</small>'}}
else check(cb(b,e));mods.clear();kbd()}
function check(c){if(lock)return;const mk=$('#mk');
if(c===T().k){lock=1;mk.className='mock ok';S.sc+=hint?5:10;$('#msg').innerHTML='✅ Sahi! <b>'+c+'</b>';
setTimeout(()=>{lock=0;S.i++;hint=0;w=0;S.i>=L[S.l].t.length?done():draw()},700)}
else{S.x++;w++;if(w>=2)hint=1;mk.className='mock bad';setTimeout(()=>{if(!lock)mk.className='mock'},350);$('#msg').innerHTML='❌ Tumne dabaya: <b>'+c+'</b> — dobara try karo';paint()}}
function done(){S.m='done';const s=S.x<=2?3:S.x<=5?2:1;sv(S.l,s);const v=L[S.l];
app.innerHTML=`<div class=card><h2>🎉 Level Clear!</h2><p>${'⭐'.repeat(s)} · Score ${S.sc} · Galtiyan ${S.x}</p><b>📚 Notes unlock ho gaye (Home ki Notes Library mein hamesha milenge):</b><pre>${notes(v)}</pre></div>`+(S.l+1<L.length?`<button onclick=intro(${S.l+1})>Next Level ▶</button>`:'<div class=card>🏆 Sab levels complete — tum Key Master ho!</div>')+`<button onclick=home()>🏠 Home</button><button onclick=start()>🔁 Dobara</button>`}
addEventListener('keydown',e=>{if(S.m!='play')return;e.preventDefault();if(e.repeat)return;const k=nm(e);down.add(k);paint();
if(k=='Ctrl'||k=='Alt'||k=='Shift'||k=='PrintScreen')return;
check(cb(k,e));mods.clear();kbd()});
addEventListener('keyup',e=>{down.delete(nm(e));if(S.m=='play'&&e.code=='PrintScreen'){e.preventDefault();check('PrintScreen')}paint()});
addEventListener('blur',()=>{down.clear();paint()});
home();
</script></body></html>
