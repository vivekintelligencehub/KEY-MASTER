<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Key Master</title>
<style>
:root{--bg:#0f1220;--card:#1b2036;--ac:#6c8cff;--ok:#3ddc97;--bad:#ff5c72;--tx:#e8ebff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:720px;margin:0 auto}
h1{text-align:center;margin:8px 0}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:16px;cursor:pointer;margin:4px;touch-action:manipulation}
button[disabled]{opacity:.4;cursor:not-allowed}
.lv{display:block;width:100%;text-align:left;background:#252b4a;margin:6px 0}
kbd{display:inline-block;background:#0b0e1a;border:1px solid #3a4270;border-bottom-width:3px;border-radius:6px;padding:4px 10px;margin:2px;font:16px monospace;color:var(--tx)}
kbd.on{background:var(--ok);color:#04150d}
.mock{border:2px dashed #3a4270;border-radius:12px;padding:16px;text-align:center;min-height:110px}
.mock.ok{border-color:var(--ok);background:#12301f}
.mock.bad{border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bar{height:8px;background:#0b0e1a;border-radius:8px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--ok)}
pre{white-space:pre-wrap;font:inherit;line-height:1.7;margin:8px 0 0}
details{margin:6px 0}
#kb{background:var(--card);border-radius:14px;padding:6px;margin:10px 0}
.r{display:flex;gap:4px;margin:4px 0}
.k{flex:1;min-width:0;height:42px;display:flex;align-items:center;justify-content:center;background:#252b4a;border-radius:8px;font-size:13px;cursor:pointer;border-bottom:3px solid #0b0e1a;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.k.m{background:#3a4270;font-weight:700}
.k.on{background:var(--ok);color:#04150d}
.k.t{height:32px;background:#161a2e}
.ms{display:flex;gap:6px;justify-content:center}
.ms .k{height:54px;flex:none;width:96px;font-size:14px}
</style></head><body><main><h1>⌨️ Key Master</h1><div id="app"></div></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const L=[
{n:'Clipboard Basics',p:'📝 Notepad',note:'Ctrl+C = copy\nCtrl+V = paste\nCtrl+X = cut\nCtrl+Z = undo\nCtrl+Y = redo (Ctrl+Shift+Z bhi)\nCtrl+A = select all\nTip: Ctrl+Shift+V = bina formatting ke paste',t:[['Selected text ko COPY karo','Ctrl+C'],['Copy kiya hua PASTE karo','Ctrl+V'],['Text CUT karo','Ctrl+X'],['Galti hui - UNDO karo','Ctrl+Z'],['Undo wapas - REDO karo','Ctrl+Y'],['Poora text SELECT ALL karo','Ctrl+A']]},
{n:'Cursor & Selection',p:'📄 Word Processor',note:'Home / End = line ka start / end\nCtrl+←/→ = ek word jump\nCtrl+Home / End = document ka start / end\nShift + move key = select karta hai\nCtrl+Shift+←/→ = word-wise select\nPageUp / PageDown = ek screen upar / neeche',t:[['Line ke START par jao','Home'],['Line ke END par jao','End'],['Ek word aage jao','Ctrl+Right'],['Ek word peeche jao','Ctrl+Left'],['Document ke shuru mein jao','Ctrl+Home'],['Document ke end mein jao','Ctrl+End'],['Cursor se line-end tak select karo','Shift+End'],['Ek word aage tak select karo','Ctrl+Shift+Right'],['Ek screen neeche jao','PageDown']]},
{n:'Formatting & Save',p:'📃 MS Word',note:'Ctrl+B bold | Ctrl+I italic | Ctrl+U underline\nCtrl+E center | Ctrl+L left | Ctrl+R right | Ctrl+J justify\nCtrl+S save | Ctrl+P print | Ctrl+K link\nF7 = spell check',t:[['Text BOLD karo','Ctrl+B'],['Text ITALIC karo','Ctrl+I'],['Text UNDERLINE karo','Ctrl+U'],['Text CENTER align karo','Ctrl+E'],['Document SAVE karo','Ctrl+S'],['Document PRINT karo','Ctrl+P']]},
{n:'File Explorer',p:'📁 File Explorer',note:'F2 = rename\nDelete = Recycle Bin mein bhejo\nShift+Delete = permanent delete\nAlt+Enter = properties\nF5 = refresh\nAlt+Up = parent folder | Alt+Left = back\nCtrl+Shift+N = new folder\nWin+E = Explorer kholo',t:[['File ka naam BADLO (rename)','F2'],['File ko Recycle Bin mein bhejo','Delete'],['File PERMANENTLY delete karo','Shift+Delete'],['File ki PROPERTIES kholo','Alt+Enter'],['Folder REFRESH karo','F5'],['Parent folder mein jao','Alt+Up'],['Pichle folder par wapas jao','Alt+Left']]},
{n:'Web Browser',p:'🌐 Browser',note:'Ctrl+F find | F5 refresh | Ctrl+H history | Ctrl+D bookmark\nAlt+Left back | Alt+Right forward | F11 fullscreen\n🔒 Sirf notes (yahan block hote hain, asli browser mein try karo):\nCtrl+T new tab | Ctrl+W close tab | Ctrl+Shift+T closed tab wapas | Ctrl+Tab next tab | Ctrl+N new window | Ctrl+L address bar',t:[['Page par kuch DHUNDHO','Ctrl+F'],['Page REFRESH karo','F5'],['HISTORY kholo','Ctrl+H'],['Page ko BOOKMARK karo','Ctrl+D'],['Pichle page par jao','Alt+Left'],['FULLSCREEN karo','F11']]},
{n:'Spreadsheet',p:'📊 Excel',note:'F2 = cell edit | F4 = $ absolute reference / repeat\nCtrl+Space = poora column select | Shift+Space = poori row select\nCtrl+Down = data ke end tak | Ctrl+Home = A1\nCtrl+; = aaj ki date | Ctrl+Shift+L = filter',t:[['Cell EDIT mode mein jao','F2'],['Reference ko $ se LOCK karo','F4'],['Poora COLUMN select karo','Ctrl+Space'],['Poori ROW select karo','Shift+Space'],['Data ke neeche tak jump karo','Ctrl+Down'],['Seedha A1 par jao','Ctrl+Home'],['Aaj ki DATE daalo','Ctrl+;']]},
{n:'Function Row & System',p:'🖥️ Windows',note:'F1 help | F2 rename | F3 search | F5 refresh | F6 address bar / pane\nF7 spell check | F10 menu bar | F11 fullscreen | F12 dev tools / Save As\nPrtSc = screenshot | Win = Start menu\n🔒 Sirf notes (system level, yahan nahi pakde jaate):\nAlt+F4 window band | Alt+Tab app badlo | Win+D desktop | Win+L lock | Win+Shift+S snip | Ctrl+Shift+Esc Task Manager',t:[['HELP kholo','F1'],['SEARCH / Find next','F3'],['Address bar / pane badlo','F6'],['SPELL CHECK chalao','F7'],['MENU BAR activate karo','F10'],['SCREENSHOT lo','PrintScreen'],['START MENU kholo (Windows key)','Win']]},
{n:'Power User / Coding',p:'💻 Code Editor',note:'Tab = indent | Shift+Tab = unindent\nCtrl+/ = line comment | Alt+Up/Down = line move\nCtrl+Shift+Z = redo | Insert = overwrite mode\nBackspace = pichla char delete | Esc = popup band',t:[['Line INDENT karo','Tab'],['Indent WAPAS karo','Shift+Tab'],['Line COMMENT karo','Ctrl+/'],['Line ko UPAR move karo','Alt+Up'],['REDO (doosra tarika)','Ctrl+Shift+Z'],['Overwrite mode ON/OFF','Insert'],['Pichla character delete karo','Backspace'],['Popup BAND karo','Esc']]},
{n:'Mouse + Keyboard',p:'🖱️ Mouse Practice',m:1,note:'Click = select | Double-click = open | Right-click = menu\nCtrl+Click = alag-alag multiple select\nShift+Click = range select (yahan se yahan tak)\nScroll = upar/neeche | Ctrl+Scroll = zoom in/out\nTip: Ctrl/Shift pehle tap karo, phir mouse button',t:[['File SELECT karo (single click)','Click'],['Folder KHOLO (double click)','DblClick'],['Menu kholo (right click)','RClick'],['Alag-alag files SELECT karo','Ctrl+Click'],['Pehli se yahan tak RANGE select karo','Shift+Click'],['Page neeche scroll karo','ScrollDown'],['Page upar scroll karo','ScrollUp'],['ZOOM IN karo','Ctrl+ScrollUp'],['ZOOM OUT karo','Ctrl+ScrollDown']]},
{n:'Bina Mouse Ke',p:'⌨️ Keyboard Only',note:'Tab = agle button/field par | Shift+Tab = pichle par\nEnter = click / open | Space = checkbox tick\nShift+F10 = right-click menu | Esc = menu band\nArrow keys = menu/list mein move | F10 = menu bar\nMouse ke bina poora computer chala sakte ho!',t:[['Agle button par jao','Tab'],['Pichle button par jao','Shift+Tab'],['Selected button CLICK karo','Enter'],['Checkbox TICK karo','Space'],['Right-click MENU kholo (keyboard se)','Shift+F10'],['Menu mein NEECHE jao','Down'],['Menu mein UPAR jao','Up'],['Menu BAND karo','Esc'],['Menu bar par jao','F10']]}
];
let S={m:'home',l:0,i:0,x:0,sc:0},down=new Set(),mods=new Set(),lock=0,hint=0,w=0,lc=0,tb='a';
const MO=['Ctrl','Alt','Shift','Win'];
const DN={Click:'🖱️ Left Click',RClick:'🖱️ Right Click',DblClick:'🖱️ Double Click',ScrollUp:'🖱️ Scroll ▲',ScrollDown:'🖱️ Scroll ▼'};
const LB={PrintScreen:'PrtSc',PageUp:'PgUp',PageDown:'PgDn',Backspace:'⌫',Insert:'Ins',Delete:'Del',CapsLock:'Caps',Up:'▲',Down:'▼',Left:'◀',Right:'▶'};
const ld=()=>{try{return JSON.parse(localStorage.km)||{}}catch(e){return{}}};
const sv=(l,s)=>{try{const d=ld();d[l]=Math.max(d[l]||0,s);localStorage.km=JSON.stringify(d)}catch(e){}};
const nm=e=>{const c=e.code||'';if(/^Control/.test(c))return'Ctrl';if(/^Alt/.test(c))return'Alt';if(/^Shift/.test(c))return'Shift';if(/^(Meta|OS)/.test(c))return'Win';return c.replace(/^(Key|Digit)/,'').replace('Arrow','').replace('Escape','Esc').replace('Semicolon',';').replace('Slash','/')};
const cb=(k,e)=>MO.filter(m=>m!=k&&(mods.has(m)||e&&({Ctrl:e.ctrlKey,Alt:e.altKey,Shift:e.shiftKey,Win:e.metaKey})[m])).concat(k).join('+');
const T=()=>({q:L[S.l].t[S.i][0],k:L[S.l].t[S.i][1]});
function home(){S.m='home';const d=ld(),tot=Object.values(d).reduce((a,b)=>a+b,0);
app.innerHTML=`<div class=card>⭐ Total: <b>${tot}</b> / ${L.length*3}<br><small>Level clear karoge to agla khulega. Notes level se pehle milte hain aur clear karne ke baad Notes Library mein save ho jaate hain. Phone par: Ctrl/Alt/Shift pehle tap karo (ON hoga), phir doosri key.</small></div>`+
L.map((v,i)=>{const ok=i==0||d[i-1];return `<button class=lv ${ok?'':'disabled'} onclick="intro(${i})">${ok?'':'🔒 '}Level ${i+1}: ${v.n} — ${v.p} ${'⭐'.repeat(d[i]||0)}</button>`}).join('')+
(Object.keys(d).length?`<div class=card><b>📚 Notes Library</b>`+L.map((v,i)=>d[i]?`<details><summary>Level ${i+1}: ${v.n}</summary><pre>${v.note}</pre></details>`:'').join('')+`</div>`:'')}
function intro(i){S.m='intro';S.l=i;const v=L[i];
app.innerHTML=`<div class=card><h2>Level ${i+1}: ${v.n}</h2><p>Prototype: <b>${v.p}</b> · ${v.t.length} tasks${v.m?' · 🖱️ virtual mouse milega':''}</p><b>📖 Pehle notes padh lo:</b><pre>${v.note}</pre></div><button onclick=start()>▶ Start Practice</button><button onclick=home() style="background:#444">← Back</button>`}
function start(){S.m='play';S.i=0;S.x=0;S.sc=0;hint=0;w=0;mods.clear();draw()}
function draw(){const v=L[S.l],n=v.t.length;
app.innerHTML=`<div class=card><div class=bar><i style="width:${S.i/n*100}%"></i></div><small>${v.p} · Task ${S.i+1}/${n} · Score ${S.sc} · Galtiyan ${S.x}</small></div><div class=card><div class=mock id=mk><h3>${T().q}</h3><div id=ks></div><p id=msg><small>Ctrl/Alt/Shift pehle tap karo, phir key</small></p></div><button onclick="hint=1;paint()">💡 Hint</button></div>`+
(v.m?`<div class="card ms"><div class=k onclick="vs('Click',event)">🖱️ L-Click</div><div class=k onclick="vs('RClick',event)">R-Click</div><div style="display:flex;flex-direction:column;gap:4px"><div class=k style="height:25px;width:60px" onclick="vs('ScrollUp',event)">▲</div><div class=k style="height:25px;width:60px" onclick="vs('ScrollDown',event)">▼</div></div></div>`:'')+`<div id=kb></div>`;kbd()}
function kbd(){const e=$('#kb');if(!e)return;
const P={a:['QWERTYUIOP'.split(''),'ASDFGHJKL;'.split(''),'ZXCVBNM/'.split('')],f:[['Esc','F1','F2','F3'],['F4','F5','F6','F7'],['F8','F9','F10','F11'],['F12','PrintScreen','Insert','Delete']],n:[['Up'],['Left','Down','Right'],['Home','End','PageUp','PageDown'],['Backspace','Tab','Enter'],['Space','CapsLock']]};
const key=k=>`<div class=k onclick="vk('${k}')">${LB[k]||k}</div>`;
e.innerHTML='<div class=r>'+MO.map(m=>`<div class="k m ${mods.has(m)?'on':''}" onclick="vm('${m}')">${m}</div>`).join('')+'</div>'+P[tb].map(r=>'<div class=r>'+r.map(key).join('')+'</div>').join('')+'<div class=r>'+[['a','Aa Letters'],['f','Fn Keys'],['n','Nav Keys']].map(t=>`<div class="k t ${tb==t[0]?'on':''}" onclick="tb='${t[0]}';kbd()">${t[1]}</div>`).join('')+'</div>';paint()}
function paint(){const e=$('#ks');if(S.m!='play'||!e)return;const t=T().k;
e.innerHTML=hint?t.split('+').map(k=>`<kbd class="${down.has(k)||mods.has(k)?'on':''}">${DN[k]||k}</kbd>`).join(' + '):'<kbd>?</kbd>'}
function vm(m){if(S.m!='play')return;if(T().k==m){check(m);mods.clear()}else mods.has(m)?mods.delete(m):mods.add(m);kbd()}
function vk(k){if(S.m!='play')return;check(cb(k));mods.clear();kbd()}
function vs(b,e){if(S.m!='play'||lock)return;const t=T().k,n=Date.now();
if(t=='DblClick'&&b=='Click'){if(n-lc<450){lc=0;check('DblClick')}else{lc=n;$('#msg').innerHTML='<small>Jaldi se dobara tap karo (double-click)</small>'}}
else check(cb(b,e));mods.clear();kbd()}
function check(c){if(lock)return;const mk=$('#mk');
if(c===T().k){lock=1;mk.className='mock ok';S.sc+=hint?5:10;$('#msg').innerHTML='✅ Sahi! <b>'+c+'</b>';
setTimeout(()=>{lock=0;S.i++;hint=0;w=0;S.i>=L[S.l].t.length?done():draw()},700)}
else{S.x++;w++;if(w>=2)hint=1;mk.className='mock bad';setTimeout(()=>{if(!lock)mk.className='mock'},350);$('#msg').innerHTML='❌ Tumne dabaya: <b>'+c+'</b> — dobara try karo';paint()}}
function done(){S.m='done';const s=S.x<=2?3:S.x<=5?2:1;sv(S.l,s);const v=L[S.l];
app.innerHTML=`<div class=card><h2>🎉 Level Clear!</h2><p>${'⭐'.repeat(s)} · Score ${S.sc} · Galtiyan ${S.x}</p><b>📚 Notes unlock ho gaye (Home ki Notes Library mein hamesha milenge):</b><pre>${v.note}</pre></div>`+(S.l+1<L.length?`<button onclick=intro(${S.l+1})>Next Level ▶</button>`:'<div class=card>🏆 Sab levels complete — tum Key Master ho!</div>')+`<button onclick=home()>🏠 Home</button><button onclick=start()>🔁 Dobara</button>`}
addEventListener('keydown',e=>{if(S.m!='play')return;e.preventDefault();if(e.repeat)return;const k=nm(e);down.add(k);paint();
if(k=='Ctrl'||k=='Alt'||k=='Shift'||k=='PrintScreen')return;
check(cb(k,e));mods.clear();kbd()});
addEventListener('keyup',e=>{down.delete(nm(e));if(S.m=='play'&&e.code=='PrintScreen'){e.preventDefault();check('PrintScreen')}paint()});
addEventListener('blur',()=>{down.clear();paint()});
home();
</script></body></html>
